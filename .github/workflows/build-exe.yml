name: build-exe

# 在 GitHub 的 Windows runner 上打 pcmond.exe，推 v* tag 时自动挂到 Release。
#
# 为什么需要这个：exe 约 21 MB，不适合进 git（每改一次就多 21 MB 历史），
# 所以本地构建的产物在 .gitignore 里；让 CI 产出二进制、挂 Release，是标准做法。
#
# 触发：
#   1) 手动：Actions → build-exe → Run workflow（产物在 run 的 Artifacts 里）
#   2) 推 tag：git tag v1.3.0 && git push origin v1.3.0（产物自动挂到 Release）

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # 上传 Release 资产需要

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    env:
      # Windows runner 的控制台编码是 cp1252：脚本里任何中文 print 都会 UnicodeEncodeError
      # （第一次 CI 就是挂在 make_icon.py 打印"图标已生成"这句上）。
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 建 .venv 并装运行依赖（setup.ps1 会创建 venv）
        run: powershell -ExecutionPolicy Bypass -File companion/setup.ps1 -WithTray

      - name: 装 PyInstaller
        run: companion\.venv\Scripts\python.exe -m pip install --disable-pip-version-check -q "pyinstaller>=6,<7"

      - name: 打包 exe
        run: powershell -ExecutionPolicy Bypass -File companion/packaging/build_exe.ps1 -SkipInstall

      - name: 冒烟自检（--once 必须能打出一帧 JSON）
        run: |
          # 坑：这是 windowed（GUI 子系统）exe，PowerShell 用 `& exe` 调用时**不会等待**，
          # $LASTEXITCODE 是 $null（第一次 CI 就是挂在这，报"退出码 "空白）。
          # 用 cmd /c + 重定向：cmd 会等进程退出，重定向让 stdout 有真实句柄。
          cmd /c "companion\dist\pcmond.exe --once > once.json 2> once.err"
          if ($LASTEXITCODE -ne 0) {
            Write-Host "--- stderr ---"; Get-Content once.err -Raw
            throw "--once 退出码 $LASTEXITCODE"
          }
          $out = Get-Content once.json -Raw
          Write-Host $out
          if (-not $out -or $out -notmatch '"v"\s*:\s*1') { throw "--once 输出不像一帧 JSON" }

      - name: 上传 artifact（手动触发的产物在这里）
        uses: actions/upload-artifact@v4
        with:
          name: pcmond-exe
          path: companion/dist/pcmond.exe
          if-no-files-found: error

      - name: 推 tag 时挂到 Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: companion/dist/pcmond.exe
          generate_release_notes: true
